apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-hpe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image:  mahijs/test-hpe:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
